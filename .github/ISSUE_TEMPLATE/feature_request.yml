name: Feature request
description: Propose an outcome-focused improvement to the skill or generated site.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem and verifiable outcome. Do not include secrets, private URLs, or source material that you are not authorized to share.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: user-outcome
    attributes:
      label: User outcome
      description: What should a user be able to accomplish after this change?
    validations:
      required: true
  - type: dropdown
    id: input-route
    attributes:
      label: Supported input route
      description: Which input route is most relevant to this request?
      options:
        - Current Chrome article
        - Public webpage URL
        - PDF file
        - Markdown file
        - Pasted source text
        - All input routes
        - Not input-specific
    validations:
      required: true
  - type: textarea
    id: security-impact
    attributes:
      label: Security impact
      description: Explain any effects on input trust, network access, file access, generated HTML, privacy, or credential handling. Write "None identified" if none apply.
    validations:
      required: true
  - type: textarea
    id: acceptance-evidence
    attributes:
      label: Acceptance evidence
      description: List the tests, reports, screenshots, or other evidence that would demonstrate completion.
    validations:
      required: true
